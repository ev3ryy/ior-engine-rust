window_title = "IOR Engine"
window_width = 800
window_height = 600
camera_eye = [
    0.0,
    5.0,
    -10.0,
]
camera_target = [
    0.0,
    0.0,
    0.0,
]
camera_fovy = 90.0
camera_znear = 0.1
camera_zfar = 100.0
camera_speed = 0.2
enable_vsync = false
msaa_samples = 1
initial_grid_rows = 10
initial_grid_spacing = 3.0
world_save_path = "world.ron"

[postprocess]
enabled = true
exposure = 1.0
contrast = 1.0
saturation = 1.0
tonemapping_mode = "ACES"
bloom_enabled = true
bloom_intensity = 0.03
bloom_threshold = 1.0
bloom_knee = 0.5
bloom_scatter = 1.0
vignette_enabled = true
vignette_intensity = 0.35
vignette_radius = 0.75
vignette_smoothness = 0.45
grain_enabled = false
grain_intensity = 0.015
manual_gamma_correction = false
